[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aalu"
version = "0.1.0"
description = "AALU on-board computer: drive and camper dashboards for a Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.8.1",
]

[project.optional-dependencies]
# Real serial GNSS (and later VE.Direct / MCU) on the Pi.
serial = ["pyserial==3.5"]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs real devices attached (skipped in CI)",
    "qt: needs PySide6 / an (offscreen) Qt platform",
]
addopts = "-m 'not hardware'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["aalu", "conftest"]
