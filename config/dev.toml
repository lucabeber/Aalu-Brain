# Development on a Linux PC: everything simulated, windowed.
# One monitor -> one window with a Drive/Camper switch; two monitors -> one window each.

# --- adapters: every device is simulated (labelled SIMULATED in the UI) ---------
[adapters.gnss]
adapter = "fake"          # fake | serial | replay | none
route = "assets/sample-data/route_trento.json"   # road loop the fake car drives
# adapter = "serial"; port = "/dev/ttyUSB0"; baudrate = 115200
# adapter = "replay"; file = "tests/fixtures/nmea/drive_fix.nmea"

[adapters.victron]        # house battery monitor, solar MPPT, engine DC-DC charger
adapter = "fake"

[adapters.media]
adapter = "fake"

[adapters.mcu]            # vehicle inputs (ACC, reverse), tanks, switched loads
adapter = "fake"

[adapters.system]         # real: CPU temperature, load, RAM, disk
adapter = "real"
data_dir = "/"

[simulation]
time_scale = 20            # >1 makes the simulated battery charge/discharge faster

[battery]
capacity_ah = 300               # LiFePO4
reserve_soc_pct = 10      # "empty" for the time estimate

[map]
# Raster tiles; areas already viewed are cached on disk and work offline.
tile_url = "https://tile.openstreetmap.org/"
cache_size_mb = 500
proxy = true              # fetch tiles via a local HTTP/1.1 proxy (avoids Qt HTTP/2 tile drops)
# offline_dir = "/home/pi/maps/tiles"   # pre-rendered tiles, no network needed

[navigation]
# Turn-by-turn app started full screen from the dock. Empty = button disabled.
command = []
# command = ["flatpak", "run", "io.github.rinigus.PureMaps"]

[modes]
camp_idle_timeout_s = 0   # 0 = never enter STANDBY automatically

# --- dashcam (separate process: apps/video/main.py) ---------------------------
[video]
enabled = true
root_dir = "data/dashcam"   # TBD: SSD mount point
segment_s = 60
retention_h = 5           # keep the last 5 hours of recordings
min_free_pct = 10         # and never fill the disk beyond this
protected_max_gb = 20     # "Save clip" segments are never auto-deleted
protect_before_s = 60     # "Save clip": last minute ...
protect_after_s = 60      # ... and the next one
long_protect_before_s = 300   # "Save 15 min": last 5 minutes ...
long_protect_after_s = 600    # ... and the next 10

[[video.cameras]]
name = "front"
source = "test"           # simulated camera; "v4l2-h264" for a UVC camera with H.264 output
width = 640
height = 360
fps = 15
bitrate_kbps = 600
audio = true              # cabin microphone recorded with the front camera
audio_source = "test"     # "pulse" = default microphone

[[video.cameras]]
name = "rear"
source = "test"
width = 640
height = 360
fps = 15
bitrate_kbps = 600

# --- freshness: age after which data is stale / disconnected ------------------
[freshness.gnss]
stale_after_s = 3
disconnected_after_s = 10

[freshness.house_battery]
stale_after_s = 5
disconnected_after_s = 20

[freshness.vehicle_inputs]
stale_after_s = 1.5
disconnected_after_s = 5

# Commands are refused as soon as the I/O controller stops confirming output states.
[freshness.loads]
stale_after_s = 1.5
disconnected_after_s = 5

[freshness.video]
stale_after_s = 5
disconnected_after_s = 10

[freshness.system]
stale_after_s = 15
disconnected_after_s = 60

# --- alarms (threshold + hysteresis) ------------------------------------------
[[alarms]]
id = "battery.soc_low"
source = "house_battery"
field = "soc_pct"
direction = "below"
set_at = 20
clear_at = 25
severity = "warning"
message = "House battery below 20 %"

[[alarms]]
id = "battery.soc_critical"
source = "house_battery"
field = "soc_pct"
direction = "below"
set_at = 10
clear_at = 15
severity = "critical"
message = "House battery critical: reduce consumption"

[[alarms]]
id = "battery.voltage_low"
source = "house_battery"
field = "voltage_v"
direction = "below"
set_at = 12.0
clear_at = 12.4
severity = "warning"
message = "House battery voltage low"

[[alarms]]
id = "water.fresh_low"
source = "fresh_water"
field = "level_pct"
direction = "below"
set_at = 15
clear_at = 20
severity = "info"
message = "Fresh water running low"

[[alarms]]
id = "water.grey_full"
source = "grey_water"
field = "level_pct"
direction = "above"
set_at = 85
clear_at = 75
severity = "warning"
message = "Grey water tank almost full"

[[alarms]]
id = "system.cpu_hot"
source = "system"
field = "cpu_temp_c"
direction = "above"
set_at = 80
clear_at = 72
severity = "warning"
message = "Raspberry Pi temperature high"

[ui]
night_mode = true
layout = "auto"           # auto | single | dual

[ui.drive]                # also used for the single window
screen = 0
fullscreen = false
width = 1280
height = 720
x = 0
y = 0

[ui.camper]
screen = 1                # falls back to screen 0 if missing
fullscreen = false
width = 1280
height = 800
x = 60
y = 60
